<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ふたりの家計簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Azeret+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-thumb app — sticky month bar, scrolling cards, fixed tab bar with a raised record button, bottom sheet for input */
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --surface2:#F2F6F8; --ink:#1D232B; --sub:#5D6772; --line:#DAE2E8;
  --ai:#B94862; --ai-soft:#FBE7EB; --on-ai:#FFFFFF; --rec-shadow:rgba(185,72,98,.32);
  --good:#2B8A63; --warn:#B97F0F; --bad:#D2452B; --inc:#2B8A63;
  --shadow:0 1px 2px rgba(20,27,38,.06),0 6px 20px rgba(20,27,38,.06);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Azeret Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161B; --surface:#1A2027; --surface2:#222A33; --ink:#E8EDF2; --sub:#97A3AF; --line:#2C3540;
  --ai:#F08CA0; --ai-soft:#3A2329; --on-ai:#12161B; --rec-shadow:rgba(0,0,0,.45); --good:#4DBE8E; --warn:#E2AC43; --bad:#FF7A59; --inc:#4DBE8E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161B; --surface:#1A2027; --surface2:#222A33; --ink:#E8EDF2; --sub:#97A3AF; --line:#2C3540;
  --ai:#F08CA0; --ai-soft:#3A2329; --on-ai:#12161B; --rec-shadow:rgba(0,0,0,.45); --good:#4DBE8E; --warn:#E2AC43; --bad:#FF7A59; --inc:#4DBE8E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,button,.chip,.cat,.keys{touch-action:manipulation}
.keys,.keys button,.cats,.opts,.who2,.tabs{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ai);outline-offset:0;border-color:transparent}
button:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:560px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
.month{display:flex;align-items:center;gap:2px}
.month b{font-size:18px;font-weight:700;min-width:7.5em;text-align:center}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--sub)}
.iconbtn:active{background:var(--surface2)}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
.sync[data-s="ok"] .dot{background:var(--good)} .sync[data-s="busy"] .dot{background:var(--warn)} .sync[data-s="err"] .dot{background:var(--bad)}
.banner{background:var(--ai-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner button{color:var(--ai);font-weight:700;text-decoration:underline}

/* views */
.view{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 a,.card h2 button{color:var(--ai);font-weight:500;font-size:13px;letter-spacing:0}
.hero .lbl{font-size:13px;color:var(--sub)}
.hero .big{font-size:40px;font-weight:600;line-height:1.1;margin:2px 0 8px}
.hero .row{display:flex;gap:16px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.hero .row b{color:var(--ink);font-weight:600}
.daily{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:end;gap:8px}
.daily .v{font-size:24px;font-weight:600}
.bar{position:relative;height:8px;background:var(--surface2);border-radius:99px;overflow:visible;margin-top:6px}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--ai);max-width:100%}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}
.bar>s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
.bud{display:flex;flex-direction:column;gap:12px}
.bud .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bud .h span:last-child{color:var(--sub);font-size:13px}
.over{color:var(--bad)!important;font-weight:700}
.cdot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}

/* tx list */
.txl{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.tx:last-child{border-bottom:0}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.tx .m{flex:1;min-width:0}
.tx .m b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m b.tt{display:flex;align-items:center;gap:4px;overflow:visible}
.tx .m b.tt .tn{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m b.tt .pill{flex:none;margin-left:0;white-space:nowrap}
.tx .m small{color:var(--sub);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;white-space:nowrap}
.tx .a.in{color:var(--inc)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--ai-soft);color:var(--ai);font-weight:700;vertical-align:1px;margin-left:4px}
.pill.p{background:var(--surface2);color:var(--sub)}
.pill.t{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.sh{background:rgba(59,123,232,.14);color:#3B7BE8}
.pill.me{background:rgba(47,166,127,.16);color:#2A9873}
.pill.th{background:rgba(210,85,123,.14);color:#D2557B}
.sp{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:2px 0 12px;background:var(--surface2)}
.sp i{display:block;min-width:5px}
.sp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp3 button{text-align:left;padding:9px 10px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;gap:3px;min-width:0}
.sp3 small{color:var(--sub);font-size:11.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp3 b{font-size:15px}
.sp3 em{font-style:normal;font-size:11px;color:var(--sub)}
.tent{border:1.5px solid var(--warn);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tent span{font-size:12.5px;color:var(--sub)}
.tent .trow{display:flex;gap:8px;align-items:center}.tent .trow input{flex:1;min-width:0}
.dayh{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:14px 2px 2px;font-weight:700}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 8px}

/* inbox */
.inbox{border:2px solid var(--warn)}
.ibx{padding:10px 0;border-bottom:1px solid var(--line)}
.ibx:last-child{border-bottom:0}
.ibx .t{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ai);color:var(--on-ai);border-color:var(--ai);font-weight:700}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}

/* settle */
.settle .who{font-size:17px;font-weight:700;margin:2px 0}
.settle small{color:var(--sub);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ai);color:var(--on-ai);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:11px;color:var(--sub);padding-bottom:4px}
.cal button{aspect-ratio:1/1.1;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;min-width:0;max-width:100%}
.cal button small{font-size:9px;color:var(--sub);font-family:var(--f-num);white-space:nowrap;overflow:hidden;max-width:100%}
.cal button.has small{color:var(--ink)}
.cal button.today{outline:2px solid var(--ai)}
.cal button[aria-pressed="true"]{background:var(--ai);color:var(--on-ai)}
.cal button[aria-pressed="true"] small{color:var(--on-ai)}
.cal .x{visibility:hidden}

/* charts */
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .d{font-size:11px;width:5.2em;text-align:right}
.up{color:var(--bad)} .down{color:var(--good)}
.hbars{display:flex;flex-direction:column;gap:10px;font-size:13px}
.hbars .h{display:flex;justify-content:space-between;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{background:var(--surface2);border-radius:10px;padding:10px}
.kpis small{display:block;color:var(--sub);font-size:11px}
.kpis b{font-size:15px;font-weight:600}
svg text{fill:var(--sub);font-family:var(--f-num);font-size:10px}

/* settings */
.set{display:flex;flex-direction:column}
.set .r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.set .r:last-child{border-bottom:0}
.set .r>span{flex:1;min-width:0}
.set .r small{display:block;color:var(--sub);font-size:12px}
.set .r input.bdg{width:7.5em;text-align:right;font-family:var(--f-num)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"]{background:var(--ai)}
.toggle[aria-pressed="true"]::after{transform:translateX(18px)}
.code{font-family:var(--f-num);font-size:12px;background:var(--surface2);border-radius:10px;padding:10px;overflow-x:auto;white-space:pre;color:var(--ink)}
.help{font-size:13px;color:var(--sub);line-height:1.7}
.help ol{padding-left:1.3em;margin:6px 0}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--sub);padding:4px 0}
.tabs button[aria-current="page"]{color:var(--ai);font-weight:700}
.tabs .rec{width:58px;height:58px;border-radius:20px;background:var(--ai);color:var(--on-ai);margin:-26px auto 0;justify-self:center;box-shadow:0 6px 18px var(--rec-shadow);display:grid;place-items:center}
.tabs .rec:active{transform:scale(.95)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:96%;overflow-y:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.shead{display:flex;align-items:center;gap:8px}
.shead .seg{flex:1;max-width:180px}
.shead input[type=date]{width:auto;padding:6px 8px;font-size:13px;margin-left:auto}
.amt{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;padding:4px 4px 0;min-height:56px}
.amt .expr{font-size:13px;color:var(--sub);font-family:var(--f-num);flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt .v{font-size:40px;font-weight:600;line-height:1.15}
.amt .v.zero{color:var(--line)}
.opts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.who2{display:flex;gap:8px}
.who2>*{flex:1;min-width:0}
.who2 .seg button{padding:8px 6px;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;justify-content:center;gap:24px}
.links .hint{text-decoration:underline;padding:4px 2px}
.cats{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:minmax(76px,1fr);gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{border-radius:12px;padding:9px 4px;font-size:12.5px;background:var(--surface2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.cat i{width:22px;height:22px;border-radius:7px;display:block}
.cat[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-soft);font-weight:700}
.tpl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tpl::-webkit-scrollbar{display:none}
.tpl button{border:1px dashed var(--line);border-radius:12px;padding:6px 10px;font-size:12px;text-align:left;white-space:nowrap;flex:none}
.tpl button b{display:block;font-family:var(--f-num);font-size:13px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{height:52px;border-radius:12px;background:var(--surface2);font-size:21px;font-family:var(--f-num);font-weight:500}
.keys button:active{background:var(--line)}
.keys .op{color:var(--ai);font-size:16px;font-family:var(--f-body);font-weight:700}
.keys .save{grid-row:span 2;height:auto;background:var(--ai);color:var(--on-ai);font-family:var(--f-body);font-size:17px;font-weight:700}
.more{display:flex;flex-direction:column;gap:8px}
.hint{font-size:11.5px;color:var(--sub);text-align:center}
.loading{position:relative;pointer-events:none;opacity:.6}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:rgba(8,12,18,.45);padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:9px;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--ai-soft);font-weight:700;text-decoration:underline;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head><body>

<div class="wrap">

      <button class="iconbtn" data-act="prevM" aria-label="前の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b id="mLabel">—</b>
      <button class="iconbtn" data-act="nextM" aria-label="次の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <button class="sync" id="sync" data-act="sync" data-s="local"><span class="dot"></span><span id="syncT">この端末のみ</span></button>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="メニュー">
  <button data-tab="home" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-tab="list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>履歴</button>

<script>
'use strict';
/* ========== utils ========== */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('kb_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('kb_'+k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const ym=s=>String(s).slice(0,7);
const yen=n=>(n<0?'−':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,t)=>s+(+t.amount||0),0);
const daysIn=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const addM=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mLabel=m=>{const[y,mo]=m.split('-');return y+'年'+Number(mo)+'月'};
const WD=['日','月','火','水','木','金','土'];
const PALETTE=['#2F6FDE','#E0703A','#2E9E78','#C2457A','#8A63D2','#D4A11E','#3AA0B8','#6B7A8F','#B5533C','#4E8F3A','#9C6B30','#5C6BC0','#D2557B','#2C8C99','#7D8B2E','#A05AA8'];

/* ========== config ========== */
function defaultCfg(){
  const out=['食費','外食','カフェ','日用品','交通','住居','水道光熱','通信','サブスク','趣味','交際','衣服・美容','医療','旅行','その他'];
  const inc=['給与','賞与','その他収入'];
  const cats=out.map((n,i)=>({id:'c'+i,name:n,color:PALETTE[i%PALETTE.length],type:'out',budget:0}))
    .concat(inc.map((n,i)=>({id:'i'+i,name:n,color:['#2B8A63','#3AA0B8','#7D8B2E'][i],type:'in',budget:0})));
  return {v:2,members:[{id:'a',name:'そうた'},{id:'b',name:'パートナー'}],ratio:50,categories:cats,
    methods:['三井住友NL','PayPay','現金'],fixed:[],skip:[],defaultShare:'s',privateIncome:true,askStores:['Amazon','楽天','イオン','ドン・キホーテ','ドンキ','イトーヨーカドー','コストコ','ららぽーと','ルミネ','無印','MUJIRUSHIRYOHIN','ドッグウッドプラザ','二子玉川ライズ','高島屋','Square','IKEA','グランスタ','BIGBOX'],
    prepaid:['ANA WEB','全日本空輸','日本航空','JAL','じゃらん','楽天トラベル','Booking.com','Agoda','Expedia','一休','JTB','エアトリ','ホテル','TICKETPLUS','チケット','ぴあ','イープラス'],
    rules:[{kw:'スターバックス',cat:'c2'},{kw:'タリーズ',cat:'c2'},{kw:'coffee',cat:'c2'},{kw:'コーヒー',cat:'c2'},{kw:'珈琲',cat:'c2'},{kw:'セブン',cat:'c0'},{kw:'ファミリーマート',cat:'c0'},{kw:'ローソン',cat:'c0'},{kw:'東急ストア',cat:'c0'},{kw:'TOKYU STORE',cat:'c0'},{kw:'Tokyu Food Show',cat:'c0'},{kw:'ベルクス',cat:'c0'},{kw:'PASMO',cat:'c4'},{kw:'パスモ',cat:'c4'},{kw:'東急線',cat:'c4'},{kw:'JR',cat:'c4'},{kw:'Luup',cat:'c4'},{kw:'ダイソー',cat:'c3'},{kw:'CDエナジー',cat:'c6'},{kw:'水道局',cat:'c6'},{kw:'Netflix',cat:'c8'},{kw:'ネットフリックス',cat:'c8'},{kw:'Spotify',cat:'c8'},{kw:'APPLE COM BILL',cat:'c8'},{kw:'Amazonプライム',cat:'c8'},{kw:'チケットぴあ',cat:'c9'},{kw:'109シネマズ',cat:'c9'},{kw:'Fanplus',cat:'c9'},{kw:'アスウェル',cat:'c9'},{kw:'エニタイム',cat:'c9'},{kw:'ZOZOTOWN',cat:'c11'},{kw:'ジーユー',cat:'c11'},{kw:'JAL国内線',cat:'c13'},{kw:'ANA WEB',cat:'c13'},{kw:'ホテル',cat:'c13'},{kw:'PERCUT',cat:'c11'},{kw:'AF二子玉川',cat:'c9'},{kw:'イオンフードスタイル',cat:'c0'},{kw:'Suica',cat:'c4'},{kw:'クリニック',cat:'c12'},{kw:'デンタル',cat:'c12'},{kw:'歯科',cat:'c12'},{kw:'シネマ',cat:'c9'},{kw:'ピカデリー',cat:'c9'},{kw:'映画ランド',cat:'c9'},{kw:'イープラス',cat:'c9'},{kw:'ポケモンセンター',cat:'c9'},{kw:'サイゼリヤ',cat:'c1'},{kw:'タイムデザイン',cat:'c13'},{kw:'TokyuStore',cat:'c0'},{kw:'ゾゾタウン',cat:'c11'},{kw:'八百五商店',cat:'c0'}]};
}
function normCfg(c){const d=defaultCfg();const ver=c&&c.v||1;c=Object.assign({},d,c||{});
  ['members','categories','methods','fixed','skip','rules','askStores','prepaid'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=d[k]});
  // v2: 新しい初期ルールを一度だけ足す（消したルールが毎回戻らないよう、バージョンで1回だけ）
  if(ver<2){const have=new Set(c.rules.map(r=>nz(r.kw)));d.rules.forEach(r=>{if(!have.has(nz(r.kw))&&c.categories.some(x=>x.id===r.cat))c.rules.push(r)})}
  c.v=2;return c}

/* ========== state ========== */
const S={cfg:null,tx:[],month:ym(today()),view:'home',listMode:'list',filter:'all',q:'',calDay:null,statF:'all',me:'a',quick:true};
let queue=LS.get('queue',[]),flushing=false;
const gas=()=>LS.get('gas',{})||{};
const remote=()=>!!gas().url;
const store=()=>remote()?'cache':'demo';
function saveLocal(){LS.set(store(),{cfg:S.cfg,tx:S.tx})}
const cat=id=>S.cfg.categories.find(c=>c.id===id);
const nz=s=>String(s==null?'':s).normalize('NFKC').toLowerCase();
const isAsk=t=>{const s=nz(t.store);return !!s&&(S.cfg.askStores||[]).some(k=>k&&s.includes(nz(k)))};
const mname=id=>(S.cfg.members.find(m=>m.id===id)||{name:'?'}).name;
const other=id=>id==='a'?'b':'a';
const pass=(t,f)=>f==='all'||(f==='shared'&&t.share==='s')||(f==='mine'&&t.share==='p'&&t.payer===S.me);
// 収入（設定による）と、相手の個人の支出は、本人の端末にしか表示しない
const vis=t=>!(S.cfg.privateIncome&&t.type==='in'&&t.payer!==S.me)&&!(t.type==='out'&&t.share==='p'&&t.payer!==S.me);
const monthTx=(m,f='all')=>S.tx.filter(t=>ym(t.date)===m&&vis(t)&&pass(t,f));
const outs=a=>a.filter(t=>t.type==='out');

/* ========== backend ========== */
async function call(action,data){
  const g=gas();
  const r=await fetch(g.url,{method:'POST',body:JSON.stringify(Object.assign({token:g.token,action},data||{}))});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'通信エラー');
  return j;
}
function setSync(s,msg){const el=$('#sync');el.dataset.s=s;
  $('#syncT').textContent=msg||({local:'この端末のみ',ok:'同期済み',busy:'同期中…',err:'未送信 '+queue.length+'件',off:'オフライン'}[s]||'')}
function enqueue(action,data){if(!remote())return;queue.push({action,data});LS.set('queue',queue);flush()}
async function flush(){
  if(flushing||!remote())return;
  if(!queue.length){setSync('ok');return}
  if(!navigator.onLine){setSync('err');return}
  flushing=true;setSync('busy');
  try{while(queue.length){await call(queue[0].action,queue[0].data);queue.shift();LS.set('queue',queue)}setSync('ok')}
  catch(e){setSync('err')}
  flushing=false;
}
async function pull(){
  if(!remote()){setSync('local');return}
  await flush();if(queue.length)return;
  setSync('busy');
  try{const j=await call('sync',{me:S.me});S.tx=(j.tx||[]).map(normTx);
    if(j.cfg){const mig=(j.cfg.v||1)<2;S.cfg=normCfg(j.cfg);if(mig)enqueue('cfg',{cfg:S.cfg})}else enqueue('cfg',{cfg:S.cfg});
    saveLocal();setSync('ok');applyFixed();render()}
  catch(e){setSync('err',e.message.slice(0,18))}
}
function normTx(t){t.amount=+t.amount||0;t.date=String(t.date).slice(0,10);if(typeof t.tags==='string')t.tags=t.tags?t.tags.split(',').map(s=>s.trim()).filter(Boolean):[];t.tags=t.tags||[];return t}
function addTx(t){S.tx.push(t);saveLocal();enqueue('add',{tx:t})}
function updTx(t){const i=S.tx.findIndex(x=>x.id===t.id);if(i>=0)S.tx[i]=t;saveLocal();enqueue('update',{tx:t})}
function delTx(id){S.tx=S.tx.filter(x=>x.id!==id);
  if(id.indexOf('fx_')===0&&S.cfg.skip.indexOf(id)<0){S.cfg.skip.push(id);saveCfg(true)}
  saveLocal();enqueue('delete',{id})}
let cfgTimer;
function saveCfg(now){saveLocal();clearTimeout(cfgTimer);
  if(now)enqueue('cfg',{cfg:S.cfg});else cfgTimer=setTimeout(()=>enqueue('cfg',{cfg:S.cfg}),700)}

/* fixed costs: deterministic id makes it idempotent with the GAS daily trigger */
function applyFixed(silent){
  const td=today(),cur=ym(td);let n=0;
  S.cfg.fixed.forEach(f=>{if(!f.active)return;let m=f.start||cur;let guard=0;
    while(m<=cur&&guard++<36){const d=m+'-'+pad(Math.min(+f.day||1,daysIn(m)));
      const id='fx_'+f.id+'_'+m.replace('-','');
      if(d<=td&&S.cfg.skip.indexOf(id)<0&&!S.tx.some(t=>t.id===id)){
        addTx({id,date:d,type:'out',amount:+f.amount||0,cat:f.cat,method:f.method||'',payer:f.payer||'a',share:f.share||'s',store:f.name,memo:'固定費',tags:[],src:'fixed',ts:Date.now()});n++}
      m=addM(m,1)}});
  if(n&&!silent)toast('固定費を'+n+'件 自動で計上しました');
}

/* ========== demo data ========== */
function seedDemo(){
  const cfg=defaultCfg();
  const B={c0:45000,c1:20000,c2:6000,c3:8000,c4:10000,c9:15000,c10:15000,c11:10000};
  cfg.categories.forEach(c=>{if(B[c.id])c.budget=B[c.id]});
  const cur=ym(today());const start=addM(cur,-5);
  cfg.fixed=[{id:'f1',name:'家賃',amount:128000,cat:'c5',day:27,method:'三井住友NL',payer:'a',share:'s',active:true,start},
    {id:'f2',name:'電気・ガス',amount:9800,cat:'c6',day:15,method:'三井住友NL',payer:'b',share:'s',active:true,start},
    {id:'f3',name:'スマホ',amount:3300,cat:'c7',day:20,method:'三井住友NL',payer:'a',share:'p',active:true,start},
    {id:'f4',name:'Netflix',amount:1590,cat:'c8',day:5,method:'三井住友NL',payer:'b',share:'s',active:true,start},
    {id:'f5',name:'Spotify',amount:980,cat:'c8',day:12,method:'三井住友NL',payer:'a',share:'p',active:true,start}];
  const P=[['c0','オーケー',1800,4200,'三井住友NL',9],['c0','セブン-イレブン',300,900,'PayPay',8],['c1','近所の定食屋',900,2400,'PayPay',5],
    ['c1','焼肉ディナー',5000,9000,'三井住友NL',1],['c2','スターバックス',480,720,'三井住友NL',6],['c2','珈琲焙煎所',600,1800,'PayPay',3],
    ['c3','ドラッグストア',600,2600,'PayPay',3],['c4','東急線チャージ',1000,3000,'三井住友NL',3],['c9','本屋',900,2200,'現金',2],
    ['c10','飲み会',3500,6000,'現金',2],['c11','ユニクロ',2000,6000,'三井住友NL',1]];
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const tx=[];const td=today();
  for(let k=5;k>=0;k--){const m=addM(cur,-k);const dim=daysIn(m);
    if(m+'-25'<=td)tx.push({id:'s'+m+'in',date:m+'-25',type:'in',amount:268000,cat:'i0',method:'',payer:'a',share:'p',store:'給与',memo:'',tags:[],src:'app',ts:0});
    P.forEach(([c,st,lo,hi,me,n])=>{for(let i=0;i<n;i++){const d=m+'-'+pad(1+Math.floor(rnd()*dim));if(d>td)continue;
      tx.push({id:uid()+i,date:d,type:'out',amount:Math.round((lo+rnd()*(hi-lo))/10)*10,cat:c,method:me,payer:rnd()<.55?'a':'b',share:c==='c11'||c==='c9'?'p':(rnd()<.75?'s':'p'),store:st,memo:'',tags:k===1&&c==='c1'?['記念日']:[],src:'app',ts:0})}})}
  tx.push({id:'sinbox',date:td,type:'out',amount:1280,cat:'',method:'三井住友NL',payer:'a',share:'s',store:'ブルーボトルコーヒー',memo:'',tags:[],src:'applepay',ts:Date.now()});
  return {cfg,tx};
}

/* ========== render ========== */
function render(){
  $('#mLabel').textContent=mLabel(S.month);
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.view?'page':'false'));
  $('#banner').innerHTML=remote()?'':'<div class="banner">サンプルデータで動いています。<button data-act="goSetup">データ連携を設定</button>すると、ふたりで同期できます。</div>';
  const v={home:vHome,list:vList,stats:vStats,set:vSet}[S.view];
  $('#main').innerHTML='<div class="view">'+v()+'</div>';
}
function txRow(t){
  const c=cat(t.cat)||{name:'未分類',color:'#8B95A5'};
  const title=t.type==='settle'?'精算 '+mname(t.payer)+' → '+mname(other(t.payer)):(t.store||c.name);
  const meta=[t.date.slice(5).replace('-','/'),t.store?c.name:'',t.method,mname(t.payer)].filter(Boolean).join(' · ');
  const tag=t.type==='out'?(t.share==='s'?'<span class="pill sh">共有</span>':'<span class="pill me">個人</span>'):'';
  const auto=t.src==='fixed'?' · 固定費':(t.src==='applepay'||t.src==='mail')?' · 自動':'';
  const tent=(t.tags||[]).includes('仮')?'<span class="pill t">仮</span>':'';
  const neg=t.amount<0?'<span class="pill p">返金</span>':'';
  return `<button class="tx" data-act="edit" data-id="${esc(t.id)}"><span class="ic" style="background:${t.type==='settle'?'#6B7A8F':c.color}">${esc((t.type==='settle'?'精':c.name).slice(0,1))}</span>
  <span class="m"><b class="tt"><span class="tn">${esc(title)}</span>${tag}${tent}${neg}</b><small>${esc(meta+auto)}</small></span>
  <span class="a num ${t.type==='in'?'in':''}">${t.type==='in'?'+':''}${yen(t.amount)}</span></button>`;
}
function budgetStats(m){
  const out=outs(monthTx(m));const bc=S.cfg.categories.filter(c=>c.type==='out'&&+c.budget>0);
  const rows=bc.map(c=>{const s=sum(out.filter(t=>t.cat===c.id));return{c,s,b:+c.budget,r:s/+c.budget}});
  return{rows,tb:sum(rows.map(r=>({amount:r.b}))),ts:sum(rows.map(r=>({amount:r.s})))};
}
function pace(m){const td=today();if(ym(td)!==m)return m<ym(td)?1:0;return(+td.slice(8))/daysIn(m)}
function vHome(){
  const m=S.month,td=today(),cur=m===ym(td);
  const tx=monthTx(m),out=outs(tx),spent=sum(out),inc=sum(tx.filter(t=>t.type==='in'));
  const prev=sum(outs(monthTx(addM(m,-1))));
  const {rows,tb,ts}=budgetStats(m);const p=pace(m);
  let h=`<section class="card hero"><div class="lbl">${Number(m.slice(5))}月の支出</div><div class="big num">${yen(spent)}</div>
    <div class="row"><span>収入 <b class="num">${yen(inc)}</b></span><span>収支 <b class="num">${yen(inc-spent)}</b></span>${prev?`<span>先月 <b class="num">${yen(prev)}</b></span>`:''}</div>`;
  if(tb){const r=ts/tb;const left=tb-ts;
    h+=`<div class="daily"><div><div class="lbl">予算の残り</div><div class="v num ${left<0?'over':''}">${yen(left)}</div></div>`;
    if(cur){const dl=daysIn(m)-(+td.slice(8))+1;h+=`<div style="text-align:right"><div class="lbl">今日から1日あたり</div><div class="v num ${left<0?'over':''}">${yen(Math.max(0,left)/dl)}</div></div>`}
    h+=`</div><div class="bar" title="予算消化"><i class="${r>1?'bad':r>p+.08?'warn':''}" style="width:${Math.min(100,r*100)}%"></i>${cur?`<s style="left:${p*100}%"></s>`:''}</div>`}
  h+='</section>';
  if(spent>0){const parts=[['shared','共有',out.filter(t=>t.share==='s'),'#3B7BE8'],['mine',mname(S.me)+'の個人',out.filter(t=>t.share==='p'&&t.payer===S.me),'#2FA67F']].map(([k,l,a,c])=>({k,l,c,v:sum(a),n:a.length}));
    h+=`<section class="card"><h2>共有と個人</h2><div class="sp" role="img" aria-label="共有と個人の割合">${parts.filter(p=>p.v>0).map(p=>`<i style="width:${p.v/spent*100}%;background:${p.c}"></i>`).join('')}</div>
    <div class="sp3" style="grid-template-columns:repeat(2,1fr)">${parts.map(p=>`<button data-act="goSplit" data-v="${p.k}"><small><span class="cdot" style="background:${p.c}"></span>${esc(p.k==='shared'?'共有':p.l.replace(/の個人$/,''))}</small><b class="num">${yen(p.v)}</b><em>${p.k==='shared'?'':'個人 · '}${Math.round(p.v/spent*100)}%</em></button>`).join('')}</div></section>`}
  const inbox=S.tx.filter(t=>t.type==='out'&&!t.cat&&vis(t));
  if(inbox.length){h+=`<section class="card inbox"><h2>未分類 ${inbox.length}件<span style="font-weight:400">タップで分類</span></h2>`+
    inbox.slice(0,5).map(t=>`<div class="ibx"><div class="t"><span>${esc(t.store||'（店名なし）')}${isAsk(t)?'<span class="pill">中身を確認</span>':''}<small style="color:var(--sub)"> ${t.date.slice(5).replace('-','/')} ${esc(t.method)}</small></span><b class="num">${yen(t.amount)}</b></div>
    <div class="hscroll">${topCats('out',8).map(c=>`<button class="chip" data-act="classify" data-id="${esc(t.id)}" data-cat="${c.id}"><span class="cdot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}<button class="chip" data-act="edit" data-id="${esc(t.id)}">その他…</button><button class="chip" data-act="splitTx" data-id="${esc(t.id)}">分割</button></div></div>`).join('')+'</section>'}
  const tentL=S.tx.filter(t=>t.type==='out'&&vis(t)&&(t.tags||[]).includes('仮')).sort((a,b)=>a.date.localeCompare(b.date));
  if(tentL.length){h+=`<section class="card"><h2>仮の支出 ${tentL.length}件<span style="font-weight:400">タップして月を決める</span></h2><div class="txl">${tentL.slice(0,5).map(txRow).join('')}</div>
    <div class="hint" style="text-align:left;margin-top:6px">先払い・予約の店は「仮」で入ります。引き落とし月に合わせて決めるか、そのままなら確定してください。${tentL.length>5?`（ほか${tentL.length-5}件は一覧から検索「仮」）`:''}</div></section>`}

    <div class="bar"><i class="${r>1?'bad':r>p+.08?'warn':''}" style="width:${Math.min(100,r*100)}%;${r<=1&&r<=p+.08?'background:'+c.color:''}"></i>${cur?`<s style="left:${p*100}%"></s>`:''}</div></div>`).join('')+'</div>'}
  else h+='<div class="empty">カテゴリごとに月の予算を決めると、ここに消化率が出ます。</div>';

function settleCalc(m){
  const tx=monthTx(m);const sh=outs(tx).filter(t=>t.share==='s');const total=sum(sh);
  const ra=(+S.cfg.ratio||50)/100;const paidA=sum(sh.filter(t=>t.payer==='a'));
  let net=paidA-total*ra;// >0: b owes a
  tx.filter(t=>t.type==='settle').forEach(t=>{net+=t.payer==='a'?+t.amount:-t.amount});
  return{total,paidA,paidB:total-paidA,net,ra};
}
function settleCard(m){
  const{total,paidA,paidB,net,ra}=settleCalc(m);if(!total)return'';
  const from=net>0?'b':'a',amt=Math.abs(Math.round(net));
  return `<section class="card settle"><h2>ふたりの精算<span style="font-weight:400">負担 ${Math.round(ra*100)}:${100-Math.round(ra*100)}</span></h2>

}

function donut(parts,total){

  const segs=parts.map(p=>{const len=total?p.v/total*C:0;const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 150 150" role="img" aria-label="カテゴリ別の支出"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--surface2)" stroke-width="22"/>${segs}
  <text x="75" y="70" text-anchor="middle" style="font-size:10px">支出</text><text x="75" y="88" text-anchor="middle" style="font-size:14px;fill:var(--ink);font-weight:600">${total>=10000?(total/10000).toFixed(1)+'万':Math.round(total).toLocaleString()}</text></svg>`;
}

/* ========== add / edit sheet ========== */
let F=null;
function freq(type,days){const lim=ymd(new Date(Date.now()-days*864e5));const n={};S.tx.forEach(t=>{if(t.type===type&&t.date>=lim&&t.cat)n[t.cat]=(n[t.cat]||0)+1});return n}
function topCats(type,k){const n=freq(type,60);const cs=S.cfg.categories.filter(c=>c.type===type);
  return cs.slice().sort((a,b)=>(n[b.id]||0)-(n[a.id]||0)||cs.indexOf(a)-cs.indexOf(b)).slice(0,k||cs.length)}
function templates(){const lim=ymd(new Date(Date.now()-90*864e5));const n={};
  S.tx.forEach(t=>{if(t.type!=='out'||t.date<lim||!t.cat||t.src==='fixed')return;const k=[t.cat,t.amount,t.method,t.store,t.share].join('|');n[k]=(n[k]||0)+1});
  return Object.keys(n).filter(k=>n[k]>=2).sort((a,b)=>n[b]-n[a]).slice(0,5).map(k=>{const[c,a,me,st,sh]=k.split('|');return{cat:c,amount:+a,method:me,store:st,share:sh}})}
function openSheet(t,pre){
  const last=LS.get('last',{});
  F=t?Object.assign({},t,{expr:String(Math.abs(t.amount)),neg:t.amount<0,edit:true,tags:(t.tags||[]).join(', '),more:!!(t.store||t.memo||(t.tags||[]).length)})
     :Object.assign({id:uid(),date:today(),type:'out',expr:'',cat:'',method:last.method||S.cfg.methods[0]||'',payer:S.me,share:last.share||'s',store:'',memo:'',tags:'',src:'app',edit:false,more:false},pre||{});
  renderSheet();$('#sheet').classList.add('on');$('#scrim').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');F=null}
function evalExpr(e){if(!e)return 0;let total=0,sign=1,cur='';
  for(const ch of e+'+'){if(ch==='+'||ch==='−'){total+=sign*(+cur||0);sign=ch==='+'?1:-1;cur=''}else cur+=ch}return Math.max(0,total)}
function renderSheet(){
  const v=evalExpr(F.expr);const cats=topCats(F.type);
  const tpls=!F.edit&&!F.expr&&F.type==='out'?templates():[];
  let h=`<div class="grab"></div><div class="shead"><div class="seg">${[['out','支出'],['in','収入']].map(([k,l])=>`<button data-act="ftype" data-v="${k}" aria-pressed="${F.type===k}">${l}</button>`).join('')}</div>
    <input type="date" id="fDate" value="${F.date}" data-act="fdate" aria-label="日付">
    <button class="iconbtn" data-act="ocr" aria-label="レシートを読み取る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="iconbtn" data-act="closeSheet" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="amt"><span class="expr">${/[+−]/.test(F.expr)?esc(F.expr):''}</span><span class="v num ${v?'':'zero'}">${yen(v)}</span></div>`;
  if(tpls.length)h+=`<div class="tpl">${tpls.map((t,i)=>{const c=cat(t.cat)||{};return `<button data-act="tpl" data-i="${i}"><b>${yen(t.amount)}</b>${esc(t.store||c.name)} · ${esc(t.method)}</button>`}).join('')}</div>`;
  h+=F.type==='out'?`<div class="opts">${S.cfg.methods.map(m=>`<button class="chip" data-act="fmethod" data-v="${esc(m)}" aria-pressed="${F.method===m}">${esc(m)}</button>`).join('')}</div>`:'';
  h+=`<div class="who2">${F.type==='in'&&S.cfg.privateIncome?`<span class="chip" aria-pressed="true">${esc(mname(S.me))}だけに表示</span>`:`<div class="seg" role="group" aria-label="払った人">${['a','b'].map(id=>`<button data-act="fpayer" data-v="${id}" aria-pressed="${F.payer===id}">${esc(mname(id))}</button>`).join('')}</div>`}${F.type==='out'?`<div class="seg" role="group" aria-label="共有か個人か">${[['s','共有'],['p','個人']].map(([k,l])=>`<button data-act="fshare" data-v="${k}" aria-pressed="${F.share===k}">${l}</button>`).join('')}</div>`:''}</div>
  <div class="cats">${cats.map(c=>`<button class="cat" data-act="fcat" data-v="${c.id}" aria-pressed="${F.cat===c.id}"><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join('')}</div>`;
  h+=F.more?`<div class="more"><div class="grid2"><input id="fStore" placeholder="店名" value="${esc(F.store)}" data-act="fstore"><input id="fTags" placeholder="タグ（カンマ区切り）" value="${esc(F.tags)}" data-act="ftags"></div><input id="fMemo" placeholder="メモ" value="${esc(F.memo)}" data-act="fmemo"></div>`
    :'';
  if(F.edit&&F.tags.split(/[,、]/).map(s=>s.trim()).includes('仮'))
    h+=`<div class="tent"><b>仮の支出</b><span>いつの支出にしますか（引き落とし月・利用月など）</span><div class="trow"><input type="month" id="fMonth" value="${esc(ym(F.date))}" data-act="fmonth" aria-label="支出の月"><button class="btn sm" data-act="tentOk">この月で確定</button></div></div>`;
  h+=`<div class="links">${F.more?'':`<button class="hint" data-act="fmore">店名・メモ・タグ</button>`}${F.type==='out'&&!F.neg?`<button class="hint" data-act="fsplit">分割する</button>`:''}</div>`;
  h+=`<div class="keys">${['7','8','9','del','4','5','6','+','1','2','3','save','00','0','C'].map(k=>k==='save'?`<button class="save" data-act="fsave">${F.edit?'更新':'保存'}</button>`
     :k==='del'?`<button class="op" data-key="del" aria-label="1文字消す">⌫</button>`:k==='+'?`<button class="op" data-key="+">＋</button>`:k==='C'?`<button class="op" data-key="C">C</button>`:`<button data-key="${k}">${k}</button>`).join('')}</div>`;
  h+=F.edit?`<button class="btn danger" data-act="fdel">この記録を削除</button>`:(S.quick&&!F.edit?'<div class="hint">金額を入れてカテゴリをタップすると保存されます</div>':'');
  $('#sheetIn').innerHTML=h;
}
function key(k){if(!F)return;let e=F.expr;
  if(k==='del')e=e.slice(0,-1);else if(k==='C')e='';else if(k==='+'){if(e&&!/[+−]$/.test(e))e+='+'}
  else{const parts=e.split(/[+−]/);if((parts[parts.length-1]+k).length>8)return;if(e===''&&(k==='0'||k==='00'))return;e+=k}
  F.expr=e;renderSheet()}
function saveF(){
  const amount=evalExpr(F.expr);
  if(!amount){toast('金額を入れてください');return}
  if(!F.cat){toast('カテゴリを選んでください');return}
  syncMore();
  const t={id:F.id,date:F.date||today(),type:F.type,amount:F.neg?-amount:amount,cat:F.cat,method:F.type==='out'?F.method:'',payer:F.type==='in'&&S.cfg.privateIncome?S.me:F.payer,share:F.type==='out'?F.share:'p',
    store:F.store.trim(),memo:F.memo.trim(),tags:F.tags.split(/[,、]/).map(s=>s.trim()).filter(Boolean),src:F.src||'app',ts:F.ts||Date.now()};
  const wasUncat=F.edit&&!(S.tx.find(x=>x.id===t.id)||{}).cat;
  if(F.edit){updTx(t);if(wasUncat)learnRule(t)}else{addTx(t);LS.set('last',{method:t.method,share:t.share})}
  const isEdit=F.edit;closeSheet();
  if(ym(t.date)!==S.month)S.month=ym(t.date);
  render();
  toast(isEdit?'更新しました':`${yen(amount)}　${(cat(t.cat)||{}).name}を記録しました`,isEdit?null:()=>{delTx(t.id);render();toast('取り消しました')});
}
function syncMore(){if(!F)return;['Store','Memo','Tags'].forEach(k=>{const el=$('#f'+k);if(el)F[k.toLowerCase()]=el.value})}
function learnRule(t){if(!t.store||isAsk(t))return;const kw=t.store.trim();if(S.cfg.rules.some(r=>kw.includes(r.kw)))return;
  const r={kw,cat:t.cat};if(t.type==='out'&&t.share&&t.share!==S.cfg.defaultShare)r.share=t.share; // 初期値と違う区分で分類したら、その区分も覚える
  S.cfg.rules.push(r);saveCfg(true);return true}

/* OCR */
async function doOcr(file){
  if(!remote()){toast('レシート読み取りはデータ連携の設定後に使えます');return}
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const sc=Math.min(1,1400/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);const b64=cv.toDataURL('image/jpeg',.8).split(',')[1];
  $('#sheetIn').classList.add('loading');toast('レシートを読み取っています…');
  try{const j=await call('ocr',{image:b64,cats:S.cfg.categories.filter(c=>c.type==='out').map(c=>c.name)});const r=j.result||{};
    if(r.amount)F.expr=String(Math.round(r.amount));if(r.store){F.store=r.store;F.more=true}
    if(r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))F.date=r.date;
    const c=S.cfg.categories.find(c=>c.name===r.category);if(c)F.cat=c.id;F.src='ocr';
    renderSheet();toast('読み取りました。内容を確認して保存してください')}
  catch(e){toast('読み取れませんでした：'+e.message)}
  $('#sheetIn').classList.remove('loading');
}

document.addEventListener('click',e=>{
  const k=e.target.closest('[data-key]');if(k){key(k.dataset.key);return}
  const tab=e.target.closest('[data-tab]');if(tab){S.view=tab.dataset.tab;render();window.scrollTo(0,0);return}

    case 'prevM':S.month=addM(S.month,-1);S.calDay=null;render();break;
    case 'nextM':S.month=addM(S.month,1);S.calDay=null;render();break;
    case 'sync':if(remote())pull();else{S.view='set';render();setTimeout(()=>$('#setup')&&$('#setup').scrollIntoView({behavior:'smooth'}),50)}break;
    case 'goSetup':S.view='set';render();setTimeout(()=>$('#setup').scrollIntoView({behavior:'smooth'}),50);break;
    case 'goTab':S.view=d.v;render();window.scrollTo(0,0);break;
    case 'openAdd':openSheet();break;
    case 'closeSheet':closeSheet();break;
    case 'edit':{const t=S.tx.find(x=>x.id===d.id);if(t&&t.type==='settle'){modal(`<h3>精算の記録</h3><p>${esc(mname(t.payer))} → ${esc(mname(other(t.payer)))} ${yen(t.amount)}（${t.date}）</p><div class="acts"><button class="btn danger sm" data-act="delSettle" data-id="${esc(t.id)}">削除</button><span style="flex:1"></span><button class="btn ghost" data-act="mClose">閉じる</button></div>`)}else if(t)openSheet(t);break}
    case 'delSettle':delTx(d.id);closeModal();render();break;
    case 'classify':{const t=S.tx.find(x=>x.id===d.id);if(!t)break;t.cat=d.cat;updTx(t);const learned=learnRule(t);render();toast(learned?`次から「${t.store}」は${cat(d.cat).name}に自動で分類します`:'分類しました');break}
    case 'settle':{const t={id:uid(),date:ym(today())===S.month?today():S.month+'-'+pad(daysIn(S.month)),type:'settle',amount:+d.amt,cat:'',method:'',payer:d.from,share:'p',store:'',memo:'精算',tags:[],src:'app',ts:Date.now()};addTx(t);render();toast('精算を記録しました',()=>{delTx(t.id);render()});break}
    case 'listMode':S.listMode=d.v;render();break;
    case 'filter':S.filter=d.v;render();break;
    case 'goSplit':S.filter=d.v;S.listMode='list';S.view='list';render();window.scrollTo(0,0);break;
    case 'calDay':S.calDay=S.calDay===d.d?null:d.d;render();break;
    case 'statF':S.statF=d.v;render();break;
    case 'me':S.me=d.v;LS.set('me',d.v);render();if(remote())pull();break;
    case 'privInc':S.cfg.privateIncome=!S.cfg.privateIncome;saveCfg(true);render();if(remote())setTimeout(pull,800);break;
    case 'theme':S.theme=d.v;LS.set('theme',d.v);applyTheme();render();break;
    case 'quick':S.quick=!S.quick;LS.set('quick',S.quick);render();break;
    case 'defShare':S.cfg.defaultShare=d.v;saveCfg(true);render();break;
    case 'catEdit':catModal(d.id,d.type);break;
    case 'fxEdit':fxModal(d.id);break;
    case 'addMethod':{const v=$('#newMethod').value.trim();if(v&&S.cfg.methods.indexOf(v)<0){S.cfg.methods.push(v);saveCfg(true);render()}break}
    case 'delMethod':S.cfg.methods.splice(+d.i,1);saveCfg(true);render();break;
    case 'addRule':{const kw=$('#ruleKw').value.trim();if(kw){const r={kw,cat:$('#ruleCat').value},sh=$('#ruleShare').value;if(sh)r.share=sh;S.cfg.rules.push(r);saveCfg(true);render()}break}
    case 'ruleShare':{const r=S.cfg.rules[+d.i];if(r){const nx={'':'s',s:'p',p:''}[r.share||''];if(nx)r.share=nx;else delete r.share;saveCfg(true);render()}break}
    case 'delRule':S.cfg.rules.splice(+d.i,1);saveCfg(true);render();break;
    case 'connect':{const url=$('#gUrl').value.trim(),token=$('#gTok').value.trim();
      if(/\/macros\/echo/.test(url)||/googleusercontent\.com/.test(url)){toast('これは実行結果のURLです。「デプロイを管理」にある、/exec で終わるURLを入れてください');break}
      if(!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/?#]+\/exec$/.test(url)){toast('URLは https://script.google.com/macros/s/…/exec の形です');break}
      if(!token){toast('トークンを入れてください');break}
      const wasDemo=!remote();LS.set('gas',{url,token});
      if(wasDemo){S.tx=[];const keep=S.cfg;S.cfg=normCfg(Object.assign({},keep,{fixed:[],skip:[]}));S.cfg.categories.forEach(c=>c.budget=0);saveLocal()}
      call('ping').then(()=>{toast('接続しました');pull()}).catch(err=>{const net=/Load failed|Failed to fetch|NetworkError/i.test(err.message);toast(net?'つながりません。URLと、公開設定（アクセスできるユーザー：全員）を確認してください':'接続できません：'+err.message);setSync('err',net?'接続エラー':err.message.slice(0,18))});render();break}
    case 'disconnect':{LS.set('gas',{});queue=[];LS.set('queue',[]);const dm=LS.get('demo',null)||seedDemo();S.cfg=normCfg(dm.cfg);S.tx=dm.tx.map(normTx);setSync('local');render();toast('接続を解除しました');break}
    case 'csv':{try{const b=new Blob([csv()],{type:'text/csv'});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download='kakeibo_'+today()+'.csv';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(err){toast('書き出せませんでした')}break}
    case 'csvCopy':navigator.clipboard.writeText(csv()).then(()=>toast('CSVをコピーしました'),()=>toast('コピーできませんでした'));break;
    case 'resetDemo':{const dm=seedDemo();S.cfg=dm.cfg;S.tx=dm.tx;applyFixed(true);saveLocal();render();toast('サンプルを初期化しました');break}
    // sheet
    case 'ftype':F.type=d.v;F.cat='';if(d.v==='in'&&S.cfg.privateIncome)F.payer=S.me;renderSheet();break;
    case 'fmethod':F.method=d.v;renderSheet();break;
    case 'fpayer':F.payer=d.v;renderSheet();break;
    case 'fshare':F.share=d.v||(F.share==='s'?'p':'s');renderSheet();break;
    case 'fmore':F.more=true;renderSheet();setTimeout(()=>$('#fStore')&&$('#fStore').focus(),30);break;
    case 'fcat':syncMore();F.cat=d.v;if(S.quick&&!F.edit&&evalExpr(F.expr)>0)saveF();else renderSheet();break;
    case 'tpl':{const t=templates()[+d.i];if(!t)break;F=Object.assign(F,{cat:t.cat,expr:String(t.amount),method:t.method,store:t.store,share:t.share});saveF();break}
    case 'fsave':saveF();break;
    case 'tentOk':{syncMore();F.tags=F.tags.split(/[,、]/).map(s=>s.trim()).filter(s=>s&&s!=='仮').join(', ');const tg=$('#fTags');if(tg)tg.value=F.tags;saveF();break}
    case 'addPre':{const v=$('#preKw').value.trim();if(v&&S.cfg.prepaid.indexOf(v)<0){S.cfg.prepaid.push(v);saveCfg(true);render()}break}
    case 'delPre':S.cfg.prepaid.splice(+d.i,1);saveCfg(true);render();break;
    case 'mailNow':{if(!remote()){toast('先にデータ連携を設定してください');break}toast('メールを確認しています…');
      call('mail').then(j=>{const r=j.result||{};if(r.busy){toast('処理中です。少し待ってからもう一度');return}toast(`取り込み ${r.added||0}件・打ち消し ${r.cancelled||0}件`);pull()}).catch(e=>toast('取り込めませんでした：'+e.message));break}
    case 'fdel':{const id=F.id;const bak=S.tx.find(x=>x.id===id);delTx(id);closeSheet();render();toast('削除しました',()=>{addTx(bak);if(id.indexOf('fx_')===0){S.cfg.skip=S.cfg.skip.filter(x=>x!==id);saveCfg(true)}render()});break}
    case 'ocr':$('#ocrFile').click();break;
    case 'fsplit':splitModal();break;
    case 'splitTx':{const t=S.tx.find(x=>x.id===d.id);if(t){openSheet(t);splitModal()}break}
    case 'sAdd':if(M.rows.length<6){M.rows.push({cat:'',amount:''});drawSplit()}break;
    case 'sFill':{const i=+d.i;const others=M.rows.reduce((s,r,j)=>j===i?s:s+(+r.amount||0),0);const v=M.total-others;if(v>0){M.rows[i].amount=String(v);drawSplit()}break}
    case 'sSave':{if(!splitOk())break;const base=buildTx();const n=M.rows.length;
      M.rows.forEach((r,i)=>{const t=Object.assign({},base,{id:i===0?base.id:uid(),amount:+r.amount,cat:r.cat});if(i===0&&F.edit)updTx(t);else addTx(t)});
      LS.set('last',{method:base.method,share:base.share});if(ym(base.date)!==S.month)S.month=ym(base.date);
      closeModal();closeSheet();render();toast(n+'件に分割して記録しました');break}
    case 'addAsk':{const v=$('#askKw').value.trim();if(v&&S.cfg.askStores.indexOf(v)<0){S.cfg.askStores.push(v);saveCfg(true);render()}break}
    case 'delAsk':S.cfg.askStores.splice(+d.i,1);saveCfg(true);render();break;
    // modal
    case 'mbg':if(e.target===el)closeModal();break;
    case 'mClose':closeModal();break;
    case 'mType':M.type=d.v;el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el));break;
    case 'mColor':M.color=d.v;el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el));break;
    case 'catSave':{M.name=$('#cName').value.trim();if(!M.name){toast('名前を入れてください');break}const isNew=M.isNew;delete M.isNew;
      if(isNew)S.cfg.categories.push(M);else{const i=S.cfg.categories.findIndex(c=>c.id===M.id);S.cfg.categories[i]=M}saveCfg(true);closeModal();render();break}
    case 'catDel':S.cfg.categories=S.cfg.categories.filter(c=>c.id!==M.id);S.cfg.rules=S.cfg.rules.filter(r=>r.cat!==M.id);saveCfg(true);closeModal();render();break;
    case 'xShare':M.share=d.v;el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el));break;
    case 'xActive':M.active=!M.active;el.setAttribute('aria-pressed',M.active);break;
    case 'fxSave':{M.name=$('#xName').value.trim();M.amount=+$('#xAmt').value.replace(/[^\d]/g,'');M.cat=$('#xCat').value;M.day=+$('#xDay').value;M.method=$('#xMethod').value;M.payer=$('#xPayer').value;
      if(!M.name||!M.amount){toast('名前と金額を入れてください');break}
      const i=S.cfg.fixed.findIndex(f=>f.id===M.id);if(i>=0)S.cfg.fixed[i]=M;else S.cfg.fixed.push(M);
      // keep this month's auto entry in step with an edited amount
      const cid='fx_'+M.id+'_'+ym(today()).replace('-','');const ex=S.tx.find(t=>t.id===cid);if(ex&&(ex.amount!==M.amount||ex.cat!==M.cat)){Object.assign(ex,{amount:M.amount,cat:M.cat,method:M.method,payer:M.payer,share:M.share,store:M.name});updTx(ex)}
      saveCfg(true);closeModal();applyFixed();render();break}
    case 'fxDel':S.cfg.fixed=S.cfg.fixed.filter(f=>f.id!==M.id);saveCfg(true);closeModal();render();toast('固定費を削除しました（記録済みの分は残ります）');break;
  }
});
document.addEventListener('input',e=>{const el=e.target;const a=el.dataset&&el.dataset.act;if(!a)return;
  if(a==='search'){S.q=el.value;const pos=el.selectionStart;render();const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
  else if(a==='budget'){const c=cat(el.dataset.id);c.budget=+el.value.replace(/[^\d]/g,'')||0;saveCfg()}
  else if(a==='ratio'){S.cfg.ratio=+el.value;$('#ratioT').textContent=`${mname('a')} ${S.cfg.ratio} : ${100-S.cfg.ratio} ${mname('b')}`;saveCfg()}
  else if(a==='mname'){const m=S.cfg.members.find(x=>x.id===el.dataset.id);m.name=el.value||(m.id==='a'?'1人目':'2人目');saveCfg()}
  else if(a==='fdate'&&F){F.date=el.value}
  else if(a==='fmonth'&&F&&/^\d{4}-\d{2}$/.test(el.value)){F.date=el.value+'-'+pad(Math.min(+F.date.slice(8)||1,daysIn(el.value)));const fd=$('#fDate');if(fd)fd.value=F.date}
  else if(a==='sAmt'){M.rows[+el.dataset.i].amount=el.value.replace(/[^\d]/g,'');splitUpd()}
  else if(a==='sCat'){M.rows[+el.dataset.i].cat=el.value;splitUpd()}
});
document.addEventListener('change',e=>{if(e.target.dataset&&(e.target.dataset.act==='budget'||e.target.dataset.act==='mname'))render()});
$('#ocrFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f&&F)doOcr(f)});
document.addEventListener('keydown',e=>{if(!F||!$('#sheet').classList.contains('on'))return;if(e.target.matches('input,textarea,select'))return;
  if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='+')key('+');else if(e.key==='Enter')saveF();else if(e.key==='Escape')closeSheet()});
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&remote())pull()});

/* launch params: ?add opens the keypad; ?amt=1200&cat=外食&method=PayPay&save=1 records directly */
function params(){let p;try{p=new URLSearchParams(location.search)}catch(e){return}
  if(![...p.keys()].length)return;
  const c=S.cfg.categories.find(x=>x.name===p.get('cat')||x.id===p.get('cat'));
  const pre={};if(p.get('amt'))pre.expr=String(parseInt(p.get('amt').replace(/[^\d]/g,''),10)||'');if(c){pre.cat=c.id;pre.type=c.type}
  if(p.get('method'))pre.method=p.get('method');if(p.get('store'))pre.store=p.get('store');if(p.get('type')==='in')pre.type='in';
  if(p.has('add')||p.get('amt')||c){openSheet(null,pre);if(p.get('save')==='1'&&pre.expr&&pre.cat)saveF()}
  try{history.replaceState(null,'',location.pathname)}catch(e){}}

/* ========== theme ========== */
function applyTheme(){const r=document.documentElement,t=S.theme;
  if(t==='light'||t==='dark'){r.setAttribute('data-theme',t);r.dataset.kbTheme='1'}
  else if(r.dataset.kbTheme){r.removeAttribute('data-theme');delete r.dataset.kbTheme}
  let dark=t==='dark';if(t!=='light'&&t!=='dark'){try{dark=matchMedia('(prefers-color-scheme: dark)').matches}catch(e){}}
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.remove());
  const m=document.createElement('meta');m.name='theme-color';m.content=dark?'#12161B':'#EEF3F6';document.head.appendChild(m)}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme()})}catch(e){}

/* ========== boot ========== */
(function init(){
  S.me=LS.get('me','a');S.quick=LS.get('quick',true);S.theme=LS.get('theme','auto');applyTheme();
  const c=LS.get(store(),null);
  if(c&&c.cfg){S.cfg=normCfg(c.cfg);S.tx=(c.tx||[]).map(normTx)}
  else if(remote()){S.cfg=defaultCfg();S.tx=[]}
  else{const dm=seedDemo();S.cfg=dm.cfg;S.tx=dm.tx;applyFixed(true);saveLocal()}
  render();params();
  if(remote()){setSync(queue.length?'err':'ok');pull()}else{setSync('local');applyFixed();render()}
  if('serviceWorker' in navigator&&/github\.io$|localhost/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
